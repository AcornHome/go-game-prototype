name: Publish to itch.io

# Triggers:
#   1) Publishing a GitHub Release that contains ChinaGo-*-win.zip  -> auto uploads
#   2) Manual "Run workflow" with the release tag                    -> uploads on demand
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag that holds the windows zip (e.g. v1.5.3)'
        required: true

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download windows zip from the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          mkdir -p download
          TAG="${{ steps.meta.outputs.tag }}"
          ASSET_API=$(curl -sSL --retry 5 --retry-delay 5 \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG" \
            | jq -r '[.assets[] | select(.name | test("^ChinaGo-.*-win\\.zip$"))][0].url')
          if [ -z "$ASSET_API" ] || [ "$ASSET_API" = "null" ]; then
            echo "::error::No ChinaGo-*-win.zip asset found on release $TAG"
            exit 1
          fi
          echo "Downloading asset from release $TAG ..."
          curl -L --retry 5 --retry-delay 10 --retry-all-errors \
            -o download/ChinaGo-win.zip \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            "$ASSET_API"
          ls -la download/

      - name: Install butler (Linux build, runs on the overseas runner)
        shell: bash
        run: |
          curl -sSL --retry 5 --retry-delay 5 -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip butler.zip
          chmod +x butler
          ./butler -V

      - name: Extract and push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        shell: bash
        run: |
          mkdir -p dist
          unzip -o ./download/ChinaGo-win.zip -d dist
          ./butler push ./dist "${{ secrets.ITCH_USER }}/chinago:windows-stable" --user "${{ secrets.ITCH_USER }}"
